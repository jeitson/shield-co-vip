name: shield_app
description: "Cifrado Cero - App de protección contra llamadas y SMS maliciosos (Android-first, iOS planificado)."
publish_to: 'none'

# Versionado SemVer [DA-16]. version_name+version_code
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Gestión de estado + inyección de dependencias [DA-13]
  flutter_riverpod: ^2.6.1

  # Navegación con pila real, deep links y guards [04 app-flutter, mapa-navegacion]
  go_router: ^14.6.2

  # Cliente HTTP para la API /v1 (TLS, interceptores, pinning a futuro) [DA-14, DA-15]
  dio: ^5.7.0

  # Igualdad de valor para entidades/estados sin boilerplate
  equatable: ^2.0.5

  # Almacenamiento seguro de sesión/tokens (Android Keystore / iOS Keychain)
  # [DA-14, 02-seguridad §02.3]. Nunca SharedPreferences plano.
  flutter_secure_storage: ^9.2.2

  # SDK oficial de Supabase: Auth (login/registro/recuperación) y acceso a
  # Postgres con RLS para el backend real [DN-01, DA-11].
  supabase_flutter: ^2.8.0

  # Persistencia local cifrada [DA-07, 02-seguridad §02.3, 04-app-flutter §04.4].
  # drift = ORM tipado + migraciones; sqlite3 = motor nativo (con el hook
  # `sqlite3mc` de abajo aporta cifrado AES-256 estilo SQLCipher). La base se
  # abre con la DEK del keystore (core/secure); nunca en claro.
  drift: ^2.35.2
  sqlite3: ^3.7.1
  path: ^1.9.1
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Análisis estático
  flutter_lints: ^6.0.0

  # Generación de código de drift (tablas/DAOs tipados).
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

# Build hooks: bundla SQLite3MultipleCiphers (sqlite3mc) en vez del SQLite
# estándar, habilitando el cifrado en reposo de la base local (reemplaza a
# sqlcipher_flutter_libs desde drift 2.32 / sqlite3 3.x). Ver spec
# 03-persistencia-local §2 y 02-seguridad §02.3.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true

  # Nota: las fuentes (Space Grotesk, Hanken Grotesk, JetBrains Mono) y los
  # Material Symbols se empaquetarán como assets locales para operar offline
  # (ver 01-docs/06-design-system.md §6.8). Se declaran cuando se agreguen
  # los binarios de las fuentes.
  # fonts:
  #   - family: SpaceGrotesk
  #     fonts:
  #       - asset: assets/fonts/SpaceGrotesk-Regular.ttf
